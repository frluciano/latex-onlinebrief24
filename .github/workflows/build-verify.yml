# Run the same verification suite for every push and pull request so layout
# regressions are caught before they are merged or released.
name: Build LaTeX Verification

on:
  push:
    # Only run on direct updates to `main`. Feature branches are validated via
    # `pull_request`, which avoids duplicate runs for the same commit.
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # When a branch is updated repeatedly, only the newest verification run is
  # still relevant.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  latex:
    runs-on: ubuntu-latest
    strategy:
      # Keep both engine results visible even if one fails. This is useful
      # while maintaining first-class XeLaTeX and LuaLaTeX support in parallel.
      fail-fast: false
      matrix:
        # Verify both officially supported fontspec engines.
        engine:
          - xelatex
          - lualatex
          - pdflatex

    steps:
      # The workflow is fully repository-local; no external assets are needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Detect verification-relevant changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          token: ${{ github.token }}
          mode: verify

      - name: Skip heavy verification setup when inputs are unchanged
        if: steps.changes.outputs.changed != 'true'
        run: echo "No verification-relevant changes detected; skipping TeX install."

      - name: Install TeX and PDF tools
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/install-texlive
        with:
          extra-packages: >-
            poppler-utils
            texlive-fonts-extra
            texlive-lang-german
            texlive-latex-extra
            texlive-luatex
            texlive-pictures
            texlive-xetex

      # Cache the LuaLaTeX font database (luaotfload) so the expensive font
      # scan only runs once per TeX Live installation. The key includes the
      # workflow and class file hashes because adding new packages or fonts
      # invalidates the database. The restore-key falls back to any prior
      # lualatex cache for the same OS so the first run after a class change
      # still benefits from a warm cache.
      - name: Cache LuaLaTeX font database
        if: matrix.engine == 'lualatex' && steps.changes.outputs.changed == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .texlive-cache/lualatex
          key: lualatex-fonts-${{ runner.os }}-${{ hashFiles('.github/workflows/build-verify.yml', 'onlinebrief24.cls') }}
          restore-keys: lualatex-fonts-${{ runner.os }}-

      - name: Build & verify examples (${{ matrix.engine }})
        if: steps.changes.outputs.changed == 'true'
        # The verification script selects the engine via OB24_TEX_ENGINE and
        # handles the LuaLaTeX cache workaround automatically when needed.
        run: OB24_TEX_ENGINE=${{ matrix.engine }} sh scripts/verify.sh
